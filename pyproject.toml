[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semcompress"
dynamic = ["version"]
description = "Embedding-based semantic text compaction — keep what matters, drop what doesn't"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pablo Huichalaf"},
]
keywords = [
    "nlp",
    "text-compression",
    "embeddings",
    "sentence-transformers",
    "semantic-compaction",
    "context-window",
    "llm",
    "agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5.0"]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
all = [
    "semcompress[tiktoken]",
    "semcompress[mcp]",
]

[project.urls]
Homepage = "https://github.com/huichalaf/semcompress"
Repository = "https://github.com/huichalaf/semcompress"
Issues = "https://github.com/huichalaf/semcompress/issues"
Changelog = "https://github.com/huichalaf/semcompress/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/semcompress/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/semcompress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that require downloading the real embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
